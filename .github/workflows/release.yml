name: Release images

# Semantic versioning: bump farrier/__init__.py and web/package.json together, add a CHANGELOG.md
# entry, then push a tag like v0.2.0. The check job refuses a tag that doesn't match both.
# Push a tag like v0.2.0 to publish multi-arch images (amd64 + arm64) to GHCR:
#   ghcr.io/<owner>/farrier       the engine and API
#   ghcr.io/<owner>/farrier-web   the dashboard, docs and landing page
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write      # keyless signing with cosign
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the engine and web versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('farrier/__init__.py').read()).group(1))")
          web=$(python3 -c "import json;print(json.load(open('web/package.json'))['version'])")
          echo "tag=$tag engine=$py web=$web"
          echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a SemVer tag"; exit 1; }
          [ "$tag" = "$py" ] && [ "$tag" = "$web" ] || { echo "::error::tag v$tag does not match engine $py / web $web"; exit 1; }
          grep -q "## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$tag] entry"; exit 1; }

  image:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: farrier, context: ., file: Dockerfile }
          - { name: farrier-web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
