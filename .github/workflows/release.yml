name: Release images

# Semantic versioning: bump farrier/__init__.py, web/package.json and site/package.json together, add a CHANGELOG.md
# entry, then push a tag like v0.2.0. The check job refuses a tag that doesn't match all three.
# Push a tag like v0.2.0 to publish multi-arch images (amd64 + arm64) to GHCR:
#   ghcr.io/<owner>/farrier       the engine and API
#   ghcr.io/<owner>/farrier-web   the dashboard (the website, site/, is hosted separately)
# then create the GitHub Release (title "Farrier X.Y.Z", notes from the tag's CHANGELOG.md section).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write      # keyless signing with cosign
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the engine, web and site versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('farrier/__init__.py').read()).group(1))")
          web=$(python3 -c "import json;print(json.load(open('web/package.json'))['version'])")
          site=$(python3 -c "import json;print(json.load(open('site/package.json'))['version'])")
          echo "tag=$tag engine=$py web=$web site=$site"
          echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a SemVer tag"; exit 1; }
          [ "$tag" = "$py" ] && [ "$tag" = "$web" ] && [ "$tag" = "$site" ] || { echo "::error::tag v$tag does not match engine $py / web $web / site $site"; exit 1; }
          grep -q "## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$tag] entry"; exit 1; }
          # install.sh and the root compose file install this default: it must be the release being tagged
          grep -q "farrier:\${FARRIER_VERSION:-$tag}" docker-compose.yml || { echo "::error::docker-compose.yml default image is not $tag"; exit 1; }

  image:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: farrier, context: ., file: Dockerfile }
          - { name: farrier-web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}

  # The GitHub Release page, from the tag's CHANGELOG.md section, once both images are published and signed.
  # Re-running a tag updates its release; a SemVer pre-release tag (v1.2.0-rc.1) is marked pre-release.
  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m or not m.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no notes under [{tag}]")
          owner, repo = os.environ["OWNER"], os.environ["REPO"]
          raw = f"https://raw.githubusercontent.com/{repo}/main/install.sh"
          head = (f"Images (multi-arch, signed with cosign): `ghcr.io/{owner}/farrier:{tag}` and "
                  f"`ghcr.io/{owner}/farrier-web:{tag}`.\n\n```bash\n"
                  f"curl -fsSL {raw} | sh                    # install or upgrade\n"
                  f"curl -fsSL {raw} | FARRIER_MODE=demo sh  # try the demo\n```\n\n")
          open("release-notes.md", "w", encoding="utf-8").write(head + m.group(1).strip() + "\n")
          EOF
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in *-*) kind="--prerelease" ;; *) kind="--latest" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Farrier ${tag#v}" --notes-file release-notes.md $kind
          else
            gh release create "$tag" --title "Farrier ${tag#v}" --notes-file release-notes.md --verify-tag $kind
          fi
